<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>VENDAVAL · phone test</title>
<style>
  body{font:15px/1.4 system-ui,sans-serif;margin:0;padding:14px;background:#f4ece0;color:#10232f}
  h1{font-size:19px;margin:0 0 4px}p{margin:0 0 10px}
  table{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
  td{border-bottom:1px solid #ddd;padding:5px 6px;vertical-align:top;word-break:break-word}td:first-child{width:38%;color:#555}
  .bad{color:#b3261e;font-weight:600}.ok{color:#1b6e2f}
  button{font:inherit;padding:10px 14px;margin:6px 6px 6px 0;border:0;border-radius:20px;background:#1d6fc8;color:#fff}
  canvas{display:block;width:100%;height:80px;background:#0b2a3c;border-radius:8px;margin:8px 0}
</style>
</head>
<body>
<h1>Phone test</h1>
<p>Open this page on the phone where things go wrong, tap <b>Test sound</b> and then <b>Test sound (big buffer)</b>, wait for the speed test, then take a screenshot (or tap <b>Copy</b> and paste it in the chat).</p>
<button id="snd">Test sound</button><button id="snd2">Test sound (big buffer)</button><button id="cp">Copy</button>
<canvas id="cv"></canvas>
<table id="t"></table>
<script>
(function () {
  var rows = [], T = document.getElementById('t');
  function row(k, v, bad) {
    var tr = document.createElement('tr');
    tr.innerHTML = '<td></td><td></td>'; tr.children[0].textContent = k; tr.children[1].textContent = v;
    if (bad === true) tr.children[1].className = 'bad'; else if (bad === false) tr.children[1].className = 'ok';
    T.appendChild(tr); rows.push(k + ': ' + v); return tr.children[1];
  }
  var n = navigator, mm = function (q) { return window.matchMedia && matchMedia(q).matches; };
  row('Browser', n.userAgent);
  row('Screen', screen.width + '×' + screen.height + ' · window ' + innerWidth + '×' + innerHeight + ' · pixel ratio ' + (window.devicePixelRatio || 1));
  row('CPU cores / memory', (n.hardwareConcurrency || '?') + ' cores · ' + (n.deviceMemory ? n.deviceMemory + ' GB' : 'memory ?'));
  row('Reduce motion (system)', mm('(prefers-reduced-motion: reduce)') ? 'ON: animations are switched off' : 'off', mm('(prefers-reduced-motion: reduce)'));
  row('Battery saver / data saver', n.connection && n.connection.saveData ? 'data saver ON' : 'no data saver signal');

  // ---- WebGL: what the fluid toys (dragon, swirl, blob) need
  function gl(v) {
    var c = document.createElement('canvas'), g = null;
    try { g = c.getContext(v, { failIfMajorPerformanceCaveat: false }); } catch (e) {}
    return g;
  }
  var g2 = gl('webgl2'), g1 = g2 || gl('webgl') || gl('experimental-webgl'), g = g2 || g1;
  row('WebGL 2', g2 ? 'yes' : 'NO', !g2);
  row('WebGL 1', g1 ? 'yes' : 'NO (fluid effects cannot run)', !g1);
  if (g) {
    var dbg = g.getExtension('WEBGL_debug_renderer_info');
    row('Graphics chip', dbg ? g.getParameter(dbg.UNMASKED_RENDERER_WEBGL) + ' (' + g.getParameter(dbg.UNMASKED_VENDOR_WEBGL) + ')' : g.getParameter(g.RENDERER));
    var mp = g.getShaderPrecisionFormat(g.FRAGMENT_SHADER, g.MEDIUM_FLOAT), hp = g.getShaderPrecisionFormat(g.FRAGMENT_SHADER, g.HIGH_FLOAT);
    row('Shader precision', 'medium ' + mp.precision + ' bits · high ' + (hp.precision || 'none') + ' bits', mp.precision < 20);
    var ok = false;
    try {
      var half = g2 ? (g.getExtension('EXT_color_buffer_float'), g.HALF_FLOAT) : (g.getExtension('OES_texture_half_float') || {}).HALF_FLOAT_OES;
      if (half) {
        var tx = g.createTexture(); g.bindTexture(g.TEXTURE_2D, tx);
        g.texImage2D(g.TEXTURE_2D, 0, g2 ? g.RGBA16F : g.RGBA, 4, 4, 0, g.RGBA, half, null);
        var fb = g.createFramebuffer(); g.bindFramebuffer(g.FRAMEBUFFER, fb);
        g.framebufferTexture2D(g.FRAMEBUFFER, g.COLOR_ATTACHMENT0, g.TEXTURE_2D, tx, 0);
        ok = g.checkFramebufferStatus(g.FRAMEBUFFER) === g.FRAMEBUFFER_COMPLETE;
      }
    } catch (e) {}
    row('Float textures (fluid)', ok ? 'yes' : 'NO', !ok);
    row('Smooth float filtering', g2 || g.getExtension('OES_texture_half_float_linear') ? 'yes' : 'NO (blocky fluid)', !(g2 || g.getExtension('OES_texture_half_float_linear')));
    row('Max texture / uniforms', g.getParameter(g.MAX_TEXTURE_SIZE) + ' px · ' + g.getParameter(g.MAX_FRAGMENT_UNIFORM_VECTORS) + ' uniforms');
  }

  // ---- speed: frames per second of a simple animation for 4 s
  var cv = document.getElementById('cv'), cx = cv.getContext('2d'), fpsCell = row('Animation speed', 'measuring…'), frames = 0, t0 = 0, worst = 0, prev = 0;
  cv.width = cv.clientWidth * (devicePixelRatio || 1); cv.height = 80 * (devicePixelRatio || 1);
  function frame(t) {
    if (!t0) t0 = prev = t;
    worst = Math.max(worst, t - prev); prev = t; frames++;
    cx.fillStyle = 'rgba(11,42,60,.25)'; cx.fillRect(0, 0, cv.width, cv.height);
    for (var i = 0; i < 40; i++) { cx.fillStyle = 'hsl(' + (i * 9 + t / 10) % 360 + ',80%,60%)'; cx.beginPath();
      cx.arc((Math.sin(t / 700 + i) * .45 + .5) * cv.width, (Math.cos(t / 500 + i * 1.3) * .4 + .5) * cv.height, 6, 0, 7); cx.fill(); }
    if (t - t0 < 4000) requestAnimationFrame(frame);
    else { var fps = Math.round(frames * 1000 / (t - t0)); fpsCell.textContent = fps + ' frames/s · slowest frame ' + Math.round(worst) + ' ms';
      fpsCell.className = fps < 45 ? 'bad' : 'ok'; rows.push('Animation speed: ' + fpsCell.textContent); }
  }
  requestAnimationFrame(frame);

  // ---- sound
  var AC = window.AudioContext || window.webkitAudioContext;
  row('Web audio', AC ? 'yes' : 'NO', !AC);
  var sndCell = row('Sound test', 'tap “Test sound”, then “Test sound (big buffer)”');
  function tone(hint, label) {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    var ac; try { ac = new AC({ latencyHint: hint }); } catch (e) { ac = new AC(); }
    var go = function () {
      var o = ac.createOscillator(), gn = ac.createGain(), t = ac.currentTime + 0.05; o.type = 'sawtooth'; o.frequency.value = 330;
      gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(.15, t + .05); gn.gain.linearRampToValueAtTime(0, t + 1.2);
      o.connect(gn); gn.connect(ac.destination); o.start(t); o.stop(t + 1.3);
      var info = label + ': state ' + ac.state + ' · ' + ac.sampleRate + ' Hz · latency ' + Math.round((ac.baseLatency || 0) * 1000) + '+' +
        Math.round((ac.outputLatency || 0) * 1000) + ' ms';
      setTimeout(function () { ac.close(); }, 1700);          // closed afterwards: no hiss after the tone
      var c = row('Sound ' + label, info + ' — clean, crackling or silent?'); if (ac.state !== 'running') c.className = 'bad';
    };
    if (ac.state === 'running') go(); else ac.resume().then(go, go);
  }
  document.getElementById('snd').onclick = function () { tone('interactive', 'normal'); };
  document.getElementById('snd2').onclick = function () { tone('playback', 'big buffer'); };
  document.getElementById('cp').onclick = function () {
    var txt = rows.join('\n');
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { alert('Copied'); }, function () { prompt('Copy this:', txt); });
  };
})();
</script>
</body>
</html>
