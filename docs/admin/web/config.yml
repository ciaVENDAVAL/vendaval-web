# Sveltia CMS config for vendaval-web — generated by tools/make_config.py — edit that script, not this file.
# Docs: https://sveltiacms.app/en/docs
app_title: VENDAVAL · admin
logo:
  src: /admin/logo.png
backend:
  name: github
  repo: ciaVENDAVAL/vendaval-web
  branch: main
  auth_methods:
  - token
  commit_messages:
    create: 'Admin: create {{collection}} “{{slug}}”'
    update: 'Admin: update {{collection}} “{{slug}}”'
    delete: 'Admin: delete {{collection}} “{{slug}}”'
    uploadMedia: 'Admin: upload “{{path}}”'
    deleteMedia: 'Admin: delete “{{path}}”'
site_url: https://vendaval.cat/
media_folder: source-images
public_folder: /source-images
media_libraries:
  default:
    config:
      slugify_filename: false
      max_file_size: 25000000
slug:
  encoding: ascii
  clean_accents: true
editor:
  preview: false
output:
  json:
    indent_style: space
    indent_size: 1
  omit_empty_optional_fields: true
i18n:
  structure: multiple_folders
  locales:
  - ca
  - es
  - en
  - de
  - fr
  - it
  - ja
  default_locale: ca
asset_collections:
- name: photos
  label: Photos (originals)
  media_folder: source-images
  public_folder: /source-images
  icon: photo_library
- name: pdfs
  label: PDFs
  media_folder: static/pdf
  public_folder: /pdf
  icon: picture_as_pdf
collections:
- name: texts
  label: Web texts (7 languages)
  icon: translate
  i18n: true
  description: Every text of the website. Catalan is the reference. A change in CA, ES or EN is translated into the other two automatically; DE, FR, IT, JA keep their old text until someone translates it
    (list in CHECK-REPORT.md).
